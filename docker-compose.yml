services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    ports: ['127.0.0.1:5432:5432']
    volumes: ['atlas_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas']
      interval: 5s
      retries: 10
volumes:
  atlas_pg:
