# Include INSIDE the existing HTTPS server block. Do not apply the web Origin
# rewriting to OAuth: consent checks the exact public origin.
location ~ ^/(mcp|authorize|token|register|revoke|agent/(consent|health))$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
}
location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource(/mcp)?)$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
