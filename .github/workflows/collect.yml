name: Collect real upstream data
on:
  schedule:
    - cron: '20 21 * * 1-5'
  workflow_dispatch:
    inputs:
      series:
        description: 'Optional catalog series ID; blank collects all supported P0 series'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      REQUESTED_SERIES: ${{ inputs.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/collector/requirements.lock
      - run: python -m pip install -r services/collector/requirements.lock
      - run: python -m pip install --no-deps -e services/collector
      - name: Collect supported series independently
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          if not os.environ.get('DATABASE_URL'):
              sys.exit('Configure DATABASE_URL repository secret after applying migrations and catalog seed.')
          supported = {'akshare_sge', 'frankfurter', 'gold_api', 'fred'}
          catalog = json.load(open('config/indicators.json'))
          wanted = os.environ.get('REQUESTED_SERIES', '').strip()
          jobs = [s for s in catalog if s['providerId'] in supported and s.get('enabled', True) and (not wanted or s['id'] == wanted)]
          if not jobs:
              sys.exit('No supported enabled catalog series matches the request.')
          failures = []
          for series in jobs:
              if series['providerId'] == 'fred' and not os.environ.get('FRED_API_KEY'):
                  print(f"{series['id']}: not_configured (FRED_API_KEY missing)")
                  continue
              result = subprocess.run([sys.executable, '-m', 'atlas_collector', 'sync', '--series', series['id']])
              if result.returncode:
                  failures.append(series['id'])
          if failures:
              sys.exit('Failed series (prior data retained): ' + ', '.join(failures))
          PY
